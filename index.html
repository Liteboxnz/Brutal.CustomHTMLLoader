<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Import map if needed you get a ./_framework/dotnet.js not found error on Itch.io etc
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
    -->

    <title>WebGPU Game</title>
    <style>
        html, body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: sans-serif;
        }

        #loader {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #111;
            text-align: center;
        }

        #loader[hidden] {
            display: none;
        }

        .made-with {
            margin: 0;
            font-size: 15px;
            letter-spacing: 0.16em;
            color: #f4f4f4;
        }

        #loader img {
            width: min(440px, 78vw);
            height: auto;
        }

        #status {
            margin: 6px 0 0;
            min-height: 1.2em;
            max-width: 36rem;
            padding: 0 16px;
            font-size: 13px;
            color: #aaa;
        }

        canvas {
            display: block;
            width: min(960px, 100%);
            height: auto;
            aspect-ratio: 8 / 5;
            background: #000;
        }
    </style>
</head>
<body>
    <div id="loader">
        <p class="made-with">Made with</p>
        <img src="branding/LOGO_BRUTAL_WHT.png" alt="BRUTAL" />
        <p id="status">Loading runtime…</p>
    </div>
    <canvas id="canvas" width="960" height="600"></canvas>
    <!-- Add emscripten module here -->
    <!-- <script type="module" src="main.js"></script> -->
</body>
</html>
